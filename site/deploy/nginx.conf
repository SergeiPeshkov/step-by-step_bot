# Пример настройки nginx для сайта «По полочкам» (статические файлы из site/dist).
# Положите в /etc/nginx/sites-available/popolochkam и включите. Домен и пути замените на свои.
# HTTPS: sudo certbot --nginx -d popolochkam.ru -d www.popolochkam.ru

server {
    listen 80;
    listen [::]:80;
    server_name popolochkam.ru www.popolochkam.ru;
    return 301 https://popolochkam.ru$request_uri;
}

# Один главный адрес без www: зеркала склеиваются 301-м редиректом.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.popolochkam.ru;
    # ssl_certificate ... (добавит certbot)
    return 301 https://popolochkam.ru$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name popolochkam.ru;
    # ssl_certificate ... (добавит certbot)

    root /var/www/popolochkam;
    index index.html;
    charset utf-8;

    # Адреса страниц всегда со слешем на конце: /vopros → /vopros/ (301), чтобы не было дублей.
    rewrite ^([^.]*[^/])$ $1/ permanent;

    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;

    # Сжатие: страницы открываются быстрее.
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/javascript application/json application/xml application/rss+xml image/svg+xml;

    # Файлы с хэшем в имени не меняются — кэшируем надолго.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|webp|svg|woff2?|mp4)$ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
    # Страницы — короткий кэш, чтобы обновления статей были видны сразу.
    location ~* \.(html|xml|txt|json)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
