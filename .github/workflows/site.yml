# Собирает сайт «По полочкам» при каждом изменении папки site.
# Готовый сайт можно скачать архивом на вкладке Actions → последний запуск → Artifacts → site.
name: Сайт

on:
  push:
    paths: ["site/**", ".github/workflows/site.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/dist
